##
## ~1B Transformer++ config — multi-node (4x GH200, 16 GPUs)
## d_model=1792, n_layers=24, n_heads=28 (head_dim=64) -> ~1.01B params with GLU MLP + tied embeddings
## Global batch size: micro_bs=8 * grad_accum=2 * world_size=16 = 256 samples = 524K tokens/step
##

deterministic: False
seed: 0

log_weight_norms: False
log_attn_logits: False

trainset_path: "path/to/fwedu/fwedu_sample_100B_tokenizer_GPTNeoX/tokenized_EleutherAI_gpt-neox-20b/ctx_2048/train"
vocab_size: 50280
seq_len: 2048
sampler: 'stateful_random'
sampler_seed: 0
num_workers: 4

eval: True
validset_path: "path/to/fwedu/fwedu_sample_100B_tokenizer_GPTNeoX/tokenized_EleutherAI_gpt-neox-20b/ctx_2048/valid"
valid_tokens: 10000000
eval_every_steps: 500
eval_when_finished: True

# ~1B model configuration
model: 'transformer'
d_model: 1792
mlp_class: 'glu'
expand: '8/3'
n_layers: 24
n_heads: 28
rms_norm: True
tie_embeddings: True
torch_compile: True

allow_tf32: True

# Token budget: 20B tokens
# steps_budget = 20B / (seq_len * micro_batch_size * grad_accumulation_steps * ddp_world_size)
# With 16 GPUs (4 nodes): 20B / (2048 * 8 * 2 * 16) = 38147 steps
# Effective batch size: 8 * 2 * 16 = 256 samples = 524K tokens/step
steps_budget: 38147

micro_batch_size: 8
grad_accumulation_steps: 2

dtype: 'bfloat16'

# Optimizer settings (will be overridden per experiment)
optim: 'muon_torch'
lr: 0.001
adamw_weight_decay: 0.0
grad_clip: 1.0
adjust_lr: 'match_adam'
muon_weight_decay: 0.0
muon_beta: 0.95
muon_nesterov: True
muon_ns_steps: 5
muown_backend: 'newtonschulz5_torch'
adamw_beta1: 0.9
adamw_beta2: 0.95

scheduler: 'wsd'
warmup_steps: 0.02
cooldown_steps: 0.2
lr_start: 0.0
lr_end: 0.0
lr_end_pct: null

log_every_steps: 10
print_progress: False

use_wandb: True
wandb_project: '1B_multinode'
wandb_dir: '~/repos/muown/wandb'
wandb_run_name: 'base'

exp_name: 'base'
out_dir: 'path/to/1B_multinode/checkpoints'
over_write: True

resume: False
resume_step: null
resume_exp_name: null
wandb_run_id: null

save_last_checkpoint: True
save_intermediate_checkpoints: True
save_every_steps: 10000

max_checkpoints: 1